    <style>
      #root {
        min-height: 100vh; background: #0A0A0F;
        display: flex; align-items: center; justify-content: center;
      }
      #root:empty::after {
        content: '';
        width: 24px; height: 24px;
        border: 2px solid rgba(16,185,129,0.3);
        border-top-color: #10B981;
        border-radius: 50%;
        animation: tokup-spin 0.8s linear infinite;
      }
      @keyframes tokup-spin { to { transform: rotate(360deg); } }
    </style>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  <div id="err" style="display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:#0A0A0F;color:#EF4444;padding:40px;font-family:monospace;font-size:14px;z-index:9999;overflow:auto;"></div>
<script>
window.onerror = function(m,u,l,c,e) {
  var el = document.getElementById('err');
  el.style.display = 'block';
  el.textContent = m + '
' + (e ? e.stack : (u + ':' + l));
};
window.addEventListener('unhandledrejection', function(e) {
  document.getElementById('err').style.display = 'block';
  document.getElementById('err').textContent = e.reason ? (e.reason.stack || e.reason.message || String(e.reason)) : 'Unknown';
});
</script>
