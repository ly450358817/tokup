    <script>
    // TokUp particle background - lightweight canvas animation
    (function(){
      var canvas = document.getElementById('bg-canvas');
      if (!canvas) return;
      var ctx = canvas.getContext('2d');
      var W, H, particles = [], streaks = [];
      var PARTICLE_COUNT, MAX_STREAKS = 3;
      
      function resize() {
        W = canvas.width = window.innerWidth;
        H = canvas.height = window.innerHeight;
        PARTICLE_COUNT = Math.min(120, Math.floor(W * H / 15000));
        while (particles.length < PARTICLE_COUNT) {
          particles.push({ x: Math.random()*W, y: Math.random()*H, vx: (Math.random()-0.5)*0.3, vy: (Math.random()-0.5)*0.3, r: Math.random()*2.5+1, o: Math.random()*0.4+0.3 });
        }
        particles.length = PARTICLE_COUNT;
      }
      
      function addStreak() {
        if (streaks.length >= MAX_STREAKS) return;
        streaks.push({
          x: Math.random() * W, y: Math.random() * H,
          vx: (Math.random()-0.5)*2.5, vy: (Math.random()-0.5)*2.5-0.5,
          life: 1, len: Math.random()*80+40,
          width: Math.random()*0.8+0.2
        });
      }
      
      var streakTimer = 0;
      function animate() {
        ctx.clearRect(0, 0, W, H);
        
        // Draw particles
        for (var i = 0; i < particles.length; i++) {
          var p = particles[i];
          p.x += p.vx; p.y += p.vy;
          if (p.x < 0) p.x = W; if (p.x > W) p.x = 0;
          if (p.y < 0) p.y = H; if (p.y > H) p.y = 0;
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.r, 0, Math.PI*2);
          ctx.fillStyle = 'rgba(16,185,129,' + p.o + ')';
          ctx.fill();
        }
        
        // Draw connections between nearby particles
        for (var i = 0; i < particles.length; i++) {
          for (var j = i+1; j < particles.length; j++) {
            var dx = particles[i].x - particles[j].x;
            var dy = particles[i].y - particles[j].y;
            var dist = Math.sqrt(dx*dx + dy*dy);
            if (dist < 120) {
              ctx.beginPath();
              ctx.moveTo(particles[i].x, particles[i].y);
              ctx.lineTo(particles[j].x, particles[j].y);
              ctx.strokeStyle = 'rgba(16,185,129,' + (0.12 * (1 - dist/120)) + ')';
              ctx.lineWidth = 0.5;
              ctx.stroke();
            }
          }
        }
        
        // Draw flowing streaks (Token flow effect)
        streakTimer++;
        if (streakTimer > 180) { streakTimer = 0; addStreak(); }
        for (var i = streaks.length-1; i >= 0; i--) {
          var s = streaks[i];
          s.x += s.vx; s.y += s.vy;
          s.life -= 0.004;
          if (s.life <= 0) { streaks.splice(i, 1); continue; }
          var endX = s.x - s.vx * (s.len / Math.max(Math.abs(s.vx)*2+Math.abs(s.vy)*2, 1));
          var endY = s.y - s.vy * (s.len / Math.max(Math.abs(s.vx)*2+Math.abs(s.vy)*2, 1));
          ctx.beginPath();
          ctx.moveTo(s.x, s.y);
          ctx.lineTo(endX, endY);
          ctx.strokeStyle = 'rgba(16,185,129,' + (s.life * 0.6) + ')';
          ctx.lineWidth = s.width;
          ctx.stroke();
        }
        
        requestAnimationFrame(animate);
      }
      
      window.addEventListener('resize', resize);
      resize();
      animate();
    })();
    </script>
