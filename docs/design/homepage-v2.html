<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TokUp · 脉充 — 设计稿 v2</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;600;700&display=swap');
  
  *{margin:0;padding:0;box-sizing:border-box}
  
  body{
    background:#06060B;
    color:#fff;
    font-family:'Inter',-apple-system,sans-serif;
    overflow:hidden;
    height:100vh;
    width:100vw;
    -webkit-font-smoothing:antialiased;
  }
  
  /* ── Three.js 容器 ── */
  #three-container{
    position:fixed;
    top:0;left:0;
    width:100%;height:100%;
    z-index:0;
    pointer-events:none;
  }
  
  /* ── 背景光晕 ── */
  .bg-glow{
    position:fixed;
    border-radius:50%;
    pointer-events:none;
    z-index:0;
  }
  .bg-glow-1{
    width:50vw;height:50vw;
    background:radial-gradient(circle,rgba(5,150,105,0.06),transparent 70%);
    top:-15vw;right:-10vw;
    animation:glowFloat 12s ease-in-out infinite alternate;
  }
  .bg-glow-2{
    width:40vw;height:40vw;
    background:radial-gradient(circle,rgba(13,148,136,0.04),transparent 70%);
    bottom:-20vw;left:-15vw;
    animation:glowFloat 10s ease-in-out infinite alternate-reverse;
  }
  @keyframes glowFloat{
    0%{transform:translate(0,0) scale(1)}
    100%{transform:translate(5%,3%) scale(1.1)}
  }
  
  /* ── 地面光晕线条 ── */
  .horizon-line{
    position:fixed;
    bottom:30vh;left:0;right:0;
    height:1px;
    z-index:0;
    background:linear-gradient(90deg,transparent,rgba(16,185,129,0.06),transparent);
  }
  
  /* ── 导航 ── */
  nav{
    position:fixed;
    top:0;left:0;right:0;
    z-index:100;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:24px 48px;
    background:linear-gradient(180deg,rgba(6,6,11,0.8) 0%,transparent 100%);
  }
  
  .nav-logo{
    display:flex;
    align-items:center;
    gap:10px;
    text-decoration:none;
  }
  .nav-logo .mark{
    width:8px;height:8px;
    border-radius:1px;
    background:#10B981;
    transform:rotate(45deg);
    box-shadow:0 0 12px rgba(16,185,129,0.3);
  }
  .nav-logo span{
    font-size:14px;
    font-weight:600;
    color:#fff;
    letter-spacing:0.03em;
  }
  .nav-logo small{
    font-size:9px;
    color:rgba(255,255,255,0.25);
    font-weight:400;
    margin-left:4px;
    letter-spacing:0.05em;
  }
  
  .nav-links{
    display:flex;
    align-items:center;
    gap:36px;
  }
  .nav-links a{
    color:rgba(255,255,255,0.3);
    text-decoration:none;
    font-size:12px;
    font-weight:500;
    transition:color 0.4s;
    letter-spacing:0.02em;
  }
  .nav-links a:hover{color:rgba(255,255,255,0.6)}
  
  .nav-cta{
    padding:10px 24px;
    border-radius:10px;
    background:rgba(16,185,129,0.1);
    border:1px solid rgba(16,185,129,0.15);
    color:#34D399!important;
    font-weight:500;
    transition:all 0.4s;
  }
  .nav-cta:hover{
    background:rgba(16,185,129,0.18)!important;
    border-color:rgba(16,185,129,0.25)!important;
  }
  
  /* ── Hero ── */
  .hero{
    position:relative;
    z-index:10;
    height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:0 24px;
    pointer-events:none;
  }
  .hero *{pointer-events:auto}
  
  .hero-tag{
    display:inline-flex;
    align-items:center;
    gap:8px;
    padding:7px 16px;
    border-radius:999px;
    background:rgba(255,255,255,0.02);
    border:1px solid rgba(255,255,255,0.04);
    font-size:11px;
    color:rgba(255,255,255,0.3);
    letter-spacing:0.06em;
    font-weight:400;
    backdrop-filter:blur(12px);
    -webkit-backdrop-filter:blur(12px);
    margin-bottom:36px;
    text-transform:uppercase;
  }
  .hero-tag .status-dot{
    width:6px;height:6px;
    border-radius:50%;
    background:rgba(16,185,129,0.6);
    box-shadow:0 0 8px rgba(16,185,129,0.3);
    animation:dotPulse 2.5s ease-in-out infinite;
  }
  @keyframes dotPulse{
    0%,100%{opacity:0.4;transform:scale(1)}
    50%{opacity:1;transform:scale(1.2)}
  }
  
  .hero h1{
    font-size:clamp(36px,6vw,72px);
    font-weight:600;
    line-height:1.08;
    margin-bottom:20px;
    letter-spacing:-0.02em;
  }
  .hero h1 .gradient{
    background:linear-gradient(135deg,#fff 30%,rgba(255,255,255,0.7) 60%,#10B981 100%);
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
    background-clip:text;
  }
  .hero h1 .thin{
    font-weight:300;
    -webkit-text-fill-color:rgba(255,255,255,0.6);
  }
  
  .hero p{
    font-size:clamp(13px,1.4vw,16px);
    color:rgba(255,255,255,0.25);
    max-width:420px;
    line-height:1.8;
    margin-bottom:44px;
    font-weight:300;
    letter-spacing:0.02em;
  }
  
  .hero-btn{
    padding:16px 40px;
    border-radius:12px;
    background:linear-gradient(135deg,rgba(16,185,129,0.12),rgba(16,185,129,0.06));
    border:1px solid rgba(16,185,129,0.2);
    color:#34D399;
    font-size:14px;
    font-weight:500;
    cursor:pointer;
    transition:all 0.5s cubic-bezier(0.16,1,0.3,1);
    text-decoration:none;
    display:inline-flex;
    align-items:center;
    gap:10px;
    letter-spacing:0.03em;
    backdrop-filter:blur(8px);
    -webkit-backdrop-filter:blur(8px);
  }
  .hero-btn:hover{
    background:linear-gradient(135deg,rgba(16,185,129,0.2),rgba(16,185,129,0.1));
    border-color:rgba(16,185,129,0.3);
    transform:translateY(-1px);
    box-shadow:0 20px 60px rgba(16,185,129,0.1);
  }
  .hero-btn .arrow{
    transition:transform 0.3s;
    font-size:16px;
  }
  .hero-btn:hover .arrow{
    transform:translateX(4px);
  }
  
  /* ── 底部模型指示器 ── */
  .model-hint{
    position:fixed;
    bottom:36px;
    left:50%;
    transform:translateX(-50%);
    z-index:10;
    display:flex;
    align-items:center;
    gap:24px;
    padding:12px 28px;
    border-radius:999px;
    background:rgba(255,255,255,0.02);
    border:1px solid rgba(255,255,255,0.04);
    backdrop-filter:blur(12px);
    -webkit-backdrop-filter:blur(12px);
  }
  .model-hint span{
    font-size:11px;
    color:rgba(255,255,255,0.2);
    font-weight:400;
    white-space:nowrap;
  }
  .model-hint .sep{
    width:3px;height:3px;
    border-radius:50%;
    background:rgba(255,255,255,0.08);
  }
  .model-hint .hl{
    color:rgba(16,185,129,0.6);
    font-weight:500;
  }
  
  /* ── Design 标注 ── */
  .design-lab{
    position:fixed;
    top:80px;right:20px;
    z-index:9999;
    background:rgba(239,68,68,0.08);
    border:1px solid rgba(239,68,68,0.15);
    border-radius:10px;
    padding:10px 14px;
    font-size:10px;
    color:rgba(239,68,68,0.6);
    max-width:200px;
    backdrop-filter:blur(8px);
    -webkit-backdrop-filter:blur(8px);
    line-height:1.5;
    text-align:right;
  }
  .design-lab .pill{
    display:inline-block;
    background:rgba(239,68,68,0.1);
    padding:1px 6px;
    border-radius:3px;
    font-size:8px;
    margin-left:3px;
    letter-spacing:0.03em;
  }
  .design-lab em{
    font-style:normal;
    color:rgba(239,68,68,0.8);
  }
  
  /* ── Loading ── */
  #loading{
    position:fixed;
    top:0;left:0;right:0;bottom:0;
    z-index:99999;
    background:#06060B;
    display:flex;
    align-items:center;
    justify-content:center;
    color:rgba(255,255,255,0.15);
    font-size:12px;
    font-weight:300;
    transition:opacity 1s;
    letter-spacing:0.05em;
  }
  #loading.hidden{opacity:0;pointer-events:none}
</style>
</head>
<body>

<!-- Loading -->
<div id="loading">Loading...</div>

<!-- 设计标注 -->
<div class="design-lab">
  <em>✦ v2 设计稿</em><br>
  3D 能量环 · Three.js<br>
  <span class="pill">高级灰 × 翡翠绿</span>
  <span class="pill">镀金质感</span>
</div>

<!-- 背景 -->
<div class="bg-glow bg-glow-1"></div>
<div class="bg-glow bg-glow-2"></div>
<div class="horizon-line"></div>

<!-- Three.js 容器 -->
<div id="three-container"></div>

<!-- 导航 -->
<nav>
  <a href="#" class="nav-logo">
    <div class="mark"></div>
    <span>TokUp</span>
    <small>脉充</small>
  </a>
  <div class="nav-links">
    <a href="#">模型</a>
    <a href="#">订阅</a>
    <a href="#">文档</a>
    <a href="#" class="nav-cta">开始使用</a>
  </div>
</nav>

<!-- Hero -->
<section class="hero">
  <div class="hero-tag">
    <span class="status-dot"></span>
    19 models · compliant · transparent
  </div>
  <h1>
    <span class="gradient">Up Your AI</span><br>
    <span class="thin">Token Gateway</span>
  </h1>
  <p>Unified API for GPT, Claude, DeepSeek and more.<br>One balance. Zero lock-in.</p>
  <a href="#" class="hero-btn">
    Get Started Free
    <span class="arrow">→</span>
  </a>
</section>

<!-- 底部 -->
<div class="model-hint">
  <span><span class="hl">GPT</span>-5.5</span>
  <span class="sep"></span>
  <span><span class="hl">Claude</span> F5</span>
  <span class="sep"></span>
  <span><span class="hl">DS</span> V4 Pro</span>
  <span class="sep"></span>
  <span><span class="hl">Qwen</span> 3.7</span>
  <span class="sep"></span>
  <span>+15 more</span>
</div>

<!-- Three.js -->
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
  }
}
</script>

<script type="module">
import * as THREE from 'three';

const container = document.getElementById('three-container');
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
camera.position.set(0, 1.2, 5);
camera.lookAt(0, 0, 0);

const renderer = new THREE.WebGLRenderer({
  antialias: true,
  alpha: true,
});
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.2;
container.appendChild(renderer.domElement);

// ── 主环 ──
const ringGeo = new THREE.TorusGeometry(1.2, 0.035, 64, 128);
const ringMat = new THREE.MeshPhysicalMaterial({
  color: new THREE.Color('#059669'),
  emissive: new THREE.Color('#10B981'),
  emissiveIntensity: 0.15,
  metalness: 0.3,
  roughness: 0.15,
  clearcoat: 0.8,
  clearcoatRoughness: 0.2,
  envMapIntensity: 1.0,
});
const ring = new THREE.Mesh(ringGeo, ringMat);
ring.rotation.x = Math.PI * 0.6;
ring.rotation.z = Math.PI * 0.15;
scene.add(ring);

// ── 内环（纤细的高级镀金内圈） ──
const innerRingGeo = new THREE.TorusGeometry(1.12, 0.008, 32, 96);
const innerRingMat = new THREE.MeshPhysicalMaterial({
  color: new THREE.Color('#FCD34D'),
  emissive: new THREE.Color('#F59E0B'),
  emissiveIntensity: 0.05,
  metalness: 0.9,
  roughness: 0.1,
  clearcoat: 0.6,
});
const innerRing = new THREE.Mesh(innerRingGeo, innerRingMat);
innerRing.rotation.copy(ring.rotation);
scene.add(innerRing);

// ── 外层光晕环 ──
const glowRingGeo = new THREE.TorusGeometry(1.35, 0.06, 32, 64);
const glowRingMat = new THREE.MeshBasicMaterial({
  color: new THREE.Color('#10B981'),
  transparent: true,
  opacity: 0.04,
});
const glowRing = new THREE.Mesh(glowRingGeo, glowRingMat);
glowRing.rotation.copy(ring.rotation);
scene.add(glowRing);

// ── 粒子系统 ──
const particleCount = 400;
const particleGeo = new THREE.BufferGeometry();
const positions = new Float32Array(particleCount * 3);
const sizes = new Float32Array(particleCount);

for (let i = 0; i < particleCount; i++) {
  // 分布在环周围和环内
  const radius = 0.3 + Math.random() * 2.2;
  const theta = Math.random() * Math.PI * 2;
  const phi = Math.random() * Math.PI * 2;
  positions[i * 3] = Math.cos(theta) * Math.sin(phi) * radius;
  positions[i * 3 + 1] = Math.sin(theta) * Math.sin(phi) * radius * 0.4;
  positions[i * 3 + 2] = Math.cos(phi) * radius;
  sizes[i] = Math.random() * 3 + 1;
}
particleGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));

const particleMat = new THREE.PointsMaterial({
  color: '#34D399',
  size: 0.015,
  transparent: true,
  opacity: 0.3,
  blending: THREE.AdditiveBlending,
  sizeAttenuation: true,
});
const particles = new THREE.Points(particleGeo, particleMat);
scene.add(particles);

// ── 核心光点 ──
const coreGeo = new THREE.SphereGeometry(0.04, 8, 8);
const coreMat = new THREE.MeshBasicMaterial({
  color: '#10B981',
  transparent: true,
  opacity: 0.6,
});
const core = new THREE.Mesh(coreGeo, coreMat);
core.position.set(1.18, 0, 0);
ring.add(core);

// 核心的辉光
const glowCoreGeo = new THREE.SphereGeometry(0.12, 8, 8);
const glowCoreMat = new THREE.MeshBasicMaterial({
  color: '#10B981',
  transparent: true,
  opacity: 0.1,
});
const glowCore = new THREE.Mesh(glowCoreGeo, glowCoreMat);
glowCore.position.copy(core.position);
ring.add(glowCore);

// ── 动画 ──
let time = 0;

function animate() {
  requestAnimationFrame(animate);
  time += 0.005;

  // 主环旋转
  ring.rotation.y += 0.003;
  innerRing.rotation.y = ring.rotation.y;
  glowRing.rotation.y = ring.rotation.y;
  
  // 核心光点沿环运动  
  const angle = time * 0.5;
  core.position.x = Math.cos(angle) * 1.18;
  core.position.z = Math.sin(angle) * 1.18;
  glowCore.position.copy(core.position);
  
  // 核心脉冲
  const pulse = 0.6 + Math.sin(time * 3) * 0.3;
  coreMat.opacity = pulse;
  glowCoreMat.opacity = 0.05 + Math.sin(time * 3) * 0.05;

  // 粒子旋转
  particles.rotation.y += 0.0005;
  particles.rotation.x = Math.sin(time * 0.1) * 0.02;

  renderer.render(scene, camera);
}
animate();

// ── 响应式 ──
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// 隐藏 loading
setTimeout(() => {
  document.getElementById('loading').classList.add('hidden');
}, 500);
</script>
</body>
</html>
