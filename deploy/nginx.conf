# TokUp · 脉充 — Nginx 配置
# 部署到 /etc/nginx/sites-enabled/tokup（生产服务器实际配置）
# 生产环境：Cloudflare → 源站 :80（Cloudflare 负责 HTTPS）

server {
    listen 80 default_server;
    server_name tokup.net www.tokup.net;
    root /opt/tokup/frontend/dist;
    index index.html;
    client_max_body_size 100m;

    # HTML 不缓存（chunk hash 每次构建会变）
    location ~* \.html$ {
        expires -1;
        add_header Cache-Control 'no-store, no-cache, must-revalidate, proxy-revalidate';
    }

    # API 代理到后端
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host localhost;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        # AI 长思考（reasoning）可能很久无内容，放宽到 600s；后端有 25s 心跳保活
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_buffering off;
    }

    # OpenAI 兼容 /v1/* 也代理到后端 /api/v1/*
    location /v1/ {
        proxy_pass http://127.0.0.1:8000/api/v1/;
        proxy_http_version 1.1;
        proxy_set_header Host localhost;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_buffering off;
    }

    location ~* ^/assets/ThreeScene-.*\.(js|css)$ {
        expires -1;
        add_header Cache-Control 'no-store, no-cache, must-revalidate, proxy-revalidate';
        try_files $uri /index.html;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control 'public, immutable';
        try_files $uri =404;
    }

    # 外部爬虫/风控探测常请求 captcha.html，本站无此页面：返回空 200，避免 404 刷错误日志
    location = /captcha.html {
        default_type text/html;
        return 200 "ok";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
